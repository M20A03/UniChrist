# DevSecOps Hardened Security Headers (Trail of Bits & CSO Standards)

# Prevent MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking Protection
add_header X-Frame-Options "DENY" always;

# Cross-Site Scripting (XSS) Legacy Protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Strict Transport Security (HSTS) - 1 Year with Subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Permissions Policy (Restrict unneeded browser APIs)
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=(self 'https://youpi-pg.local')" always;

# Content Security Policy (Anti-XSS & Anti-Injection)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://* wss://*; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Prevent Information Leakage
add_header Server "UniChrist-Gateway" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

