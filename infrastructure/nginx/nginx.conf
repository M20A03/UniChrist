user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate Limiting Zones (DevSecOps Hardening)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Logging Format with Security Tracing
    log_format security_combined '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" '
                                 'request_time=$request_time upstream_status=$upstream_status '
                                 'ssl_proto=$ssl_protocol ssl_cipher=$ssl_cipher';

    access_log /var/log/nginx/access.log security_combined;

    # Upstream Definitions
    upstream backend_api {
        server unichrist-api:5000;
        keepalive 32;
    }

    upstream omniroute_api {
        server omniroute-proxy:7001;
        keepalive 16;
    }

    upstream youpi_api {
        server youpi-pg-gateway:8001;
        keepalive 16;
    }

    # Hardened Server Block
    server {
        listen 80;
        server_name localhost _;

        # Include Security Headers
        include /etc/nginx/security-headers.conf;

        # Max payload sizing for security protection
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Core API Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # OmniRoute AI Proxy
        location /api/v1/omniroute/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://omniroute_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # YouPI-PG Payment Gateway
        location /api/v1/youpi/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://youpi_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Swagger Docs
        location /swagger/ {
            proxy_pass http://backend_api/swagger/;
            proxy_set_header Host $host;
        }

        # Health Probe
        location /healthz {
            access_log off;
            return 200 '{"status":"HEALTHY","system":"UniChrist-Nginx-Hardened"}';
            add_header Content-Type application/json;
        }
    }
}

