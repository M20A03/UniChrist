version: '3.8'

services:
  # ============================================================================
  # 1. HARDENED REVERSE PROXY & WAF
  # ============================================================================
  ingress-proxy:
    image: nginx:1.27-alpine
    container_name: unichrist-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    depends_on:
      - unichrist-api
      - omniroute-proxy
      - youpi-pg-gateway
    networks:
      - unichrist-network

  # ============================================================================
  # 2. C# .NET 8 UNICHRIST CORE WEB API
  # ============================================================================
  unichrist-api:
    build:
      context: ../UniChristBackend
      dockerfile: Dockerfile
    container_name: unichrist-core-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - PORT=5000
      - MYSQLHOST=unichrist-mysql
      - MYSQLPORT=3306
      - MYSQLDATABASE=unichrist_db
      - MYSQLUSER=root
      - MYSQLPASSWORD=UniChristSecurePass2026!
      - REDIS_CONNECTION=unichrist-redis:6379,password=UniChristRedis2026!
      - SENTRY_DSN=https://mock-sentry-key@o0.ingest.sentry.io/0
      - OMNIROUTE_URL=http://omniroute-proxy:7001
      - YOUPI_PG_URL=http://youpi-pg-gateway:8001
    depends_on:
      - unichrist-mysql
      - unichrist-redis
    networks:
      - unichrist-network

  # ============================================================================
  # 3. HIGH-PERFORMANCE REDIS STACK (Search + JSON + Streams)
  # ============================================================================
  unichrist-redis:
    image: redis/redis-stack-server:latest
    container_name: unichrist-redis
    restart: always
    command: ["redis-server", "--requirepass", "UniChristRedis2026!", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - unichrist-network

  # ============================================================================
  # 4. PRIMARY RELATIONAL PERSISTENCE (MySQL 8.0)
  # ============================================================================
  unichrist-mysql:
    image: mysql:8.0.36
    container_name: unichrist-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=UniChristSecurePass2026!
      - MYSQL_DATABASE=unichrist_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ../UniChristBackend/Database/UniChrist_MySQL_Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../UniChristBackend/Database/UniChrist_Procedures_Triggers_Views.sql:/docker-entrypoint-initdb.d/02-procedures.sql:ro
    networks:
      - unichrist-network

  # ============================================================================
  # 5. OMNIROUTE AI INFERENCE PROXY (Free GPU Dispatcher)
  # ============================================================================
  omniroute-proxy:
    build:
      context: ../services/omniroute
      dockerfile: Dockerfile
    container_name: omniroute-proxy
    restart: always
    environment:
      - PORT=7001
      - LIGHTNING_AI_KEY=${LIGHTNING_AI_KEY:-mock}
      - HF_TOKEN=${HF_TOKEN:-mock}
      - SATURN_CLOUD_KEY=${SATURN_CLOUD_KEY:-mock}
    networks:
      - unichrist-network

  # ============================================================================
  # 6. YOUPI-PG PAYMENT GATEWAY MICROSERVICE
  # ============================================================================
  youpi-pg-gateway:
    build:
      context: ../services/youpi-pg
      dockerfile: Dockerfile
    container_name: youpi-pg-gateway
    restart: always
    environment:
      - PORT=8001
      - YOUPI_MERCHANT_KEY=christ_univ_merch_2543115
      - YOUPI_SECRET_SALT=UniChristSaltHMAC256_2026
    networks:
      - unichrist-network

  # ============================================================================
  # 7. CLAMAV ANTI-MALWARE SCANNER DAEMON
  # ============================================================================
  clamav-scanner:
    image: clamav/clamav:latest
    container_name: unichrist-clamav
    restart: always
    networks:
      - unichrist-network

networks:
  unichrist-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

